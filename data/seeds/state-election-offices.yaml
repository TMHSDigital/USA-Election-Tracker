# Official state election office URLs for the 2026 general election.
# Curated seed file for human review. Every URL below was fetched on 2026-10-18
# with curl (browser User-Agent, redirects followed); the value recorded is the
# final URL after redirects. Where curl was blocked by bot protection, the page
# was loaded in a real browser (Playwright) and this is recorded in verify_note.
#
# Field conventions:
#   http_status      worst curl status among homepage_url, voter_info_url and
#                    results_url for that state (details in notes/verify_note).
#   results_platform "clarity", "enhanced-voting", "civix" or "unknown".
#                    "enhanced-voting" is inferred from the /results/public/<name>
#                    URL path pattern, not from the hostname; review before use.
#   results_url      if no 2026 general election-night page is live yet, this is
#                    the official results landing page (see notes).
