  - source_id: ballotpedia
    name: Ballotpedia
    publisher: Lucy Burns Institute
    url: https://ballotpedia.org/
    license: Proprietary
    license_url: https://ballotpedia.org/Ballotpedia:Terms_of_service
    terms_url: https://ballotpedia.org/Ballotpedia:Terms_of_service
    status: rejected
