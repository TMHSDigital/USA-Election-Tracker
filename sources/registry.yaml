    publisher: OpenSecrets
    url: https://www.opensecrets.org/open-data/api
    license: n/a
    license_url: https://www.opensecrets.org/open-data/api
    terms_url: https://www.opensecrets.org/open-data/api
    status: dead
    verified_at: 2026-10-18
    redistribution: unknown
